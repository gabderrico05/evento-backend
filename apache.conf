# Apache Configuration for Flask App with HTTPS
# Location: /etc/apache2/sites-available/evento-app.conf
# Enable site: a2ensite evento-app.conf
# Enable modules: a2enmod ssl rewrite proxy proxy_http headers

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName seu-dominio.com
    ServerAlias www.seu-dominio.com

    # Redirecionar TODO tráfego HTTP para HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/evento-app-error.log
    CustomLog ${APACHE_LOG_DIR}/evento-app-access.log combined
</VirtualHost>

# HTTPS Server
<VirtualHost *:443>
    ServerName seu-dominio.com
    ServerAlias www.seu-dominio.com

    # SSL Certificate (Let's Encrypt)
    # Obter certificado: certbot --apache -d seu-dominio.com -d www.seu-dominio.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/seu-dominio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/seu-dominio.com/privkey.pem

    # SSL Protocol - TLS 1.2 e 1.3 APENAS
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder on

    # SSL Options
    SSLCompression off
    SSLSessionTickets off

    # OCSP Stapling
    SSLUseStapling on
    SSLStaplingCache "shmcb:logs/ssl_stapling(32768)"

    # Security Headers
    # HSTS (HTTP Strict Transport Security)
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    
    # Previne clickjacking
    Header always set X-Frame-Options "SAMEORIGIN"
    
    # Previne MIME type sniffing
    Header always set X-Content-Type-Options "nosniff"
    
    # XSS Protection
    Header always set X-XSS-Protection "1; mode=block"
    
    # Referrer Policy
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Content Security Policy
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self';"
    
    # Permissions Policy
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # Document Root (frontend estático)
    DocumentRoot /var/www/evento-app/frontend

    <Directory /var/www/evento-app/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # SPA routing - redirecionar tudo para index.html
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Cache para assets estáticos
    <LocationMatch "\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$">
        Header set Cache-Control "max-age=31536000, public, immutable"
    </LocationMatch>

    # Proxy para API Flask (Gunicorn)
    ProxyPreserveHost On
    ProxyRequests Off

    # Headers para proxy
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Ssl "on"

    # Proxy /api para Gunicorn
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api

    # Health check
    ProxyPass /health http://127.0.0.1:8000/health
    ProxyPassReverse /health http://127.0.0.1:8000/health

    # Timeout
    ProxyTimeout 60

    # Bloquear acesso a arquivos sensíveis
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.env$">
        Require all denied
    </FilesMatch>

    # Logs
    ErrorLog ${APACHE_LOG_DIR}/evento-app-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/evento-app-ssl-access.log combined
</VirtualHost>

# Global SSL Configuration
SSLStaplingCache shmcb:/var/run/ocsp(128000)
